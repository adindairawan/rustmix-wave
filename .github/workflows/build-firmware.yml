name: Build ESP32-S3 Firmware

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc clang libudev-dev libssl-dev pkg-config python3 python3-pip python3-venv cmake ninja-build

      - name: Install Espressif Rust Xtensa Toolchain
        uses: esp-rs/xtensa-toolchain@v1.5
        with:
          default: true
          buildtargets: esp32s3
          ldproxy: true

      - name: Compile Release Firmware
        run: |
          export RUSTFLAGS="--cfg esp_idf_version_least_5_5_0"
          cargo build --release --target xtensa-esp32s3-espidf -Zbuild-std=core,alloc,std,panic_abort

      - name: Upload Compiled Binary
        uses: actions/upload-artifact@v4
        with:
          name: waveshare-epd397-deep-sleep-firmware
          path: target/xtensa-esp32s3-espidf/release/waveshare-epd397-rust-app
